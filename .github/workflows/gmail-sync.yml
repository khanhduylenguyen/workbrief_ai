# Calls the backend every 30 minutes so connected Gmail accounts are synced automatically.
# (Vercel Hobby cron only runs once a day; this workflow fills the gap for free.)
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#   BACKEND_URL   e.g. https://backend-dy-08b7.vercel.app   (no trailing slash)
#   CRON_SECRET   same value as CRON_SECRET in the backend's Vercel environment variables
name: Gmail auto-sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/gmail-sync
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL / CRON_SECRET secrets are not set — skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 300 \
            -X POST "$BACKEND_URL/api/cron/gmail-sync" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Gmail sync returned HTTP $status"
            exit 1
          fi
